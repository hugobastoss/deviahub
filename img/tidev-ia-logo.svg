<svg viewBox="0 0 480 160" xmlns="http://www.w3.org/2000/svg" width="480" height="160">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;display=swap');
    </style>
  </defs>

  <!-- ICON MARK -->
  <rect x="0" y="10" width="140" height="140" rx="28" fill="#1C1C1A"/>

  <!-- Circuit node grid — neural/TI symbol -->
  <!-- top nodes -->
  <circle cx="48" cy="44" r="4" fill="#534AB7"/>
  <circle cx="70" cy="38" r="3" fill="#7F77DD" opacity=".7"/>
  <circle cx="92" cy="44" r="4" fill="#534AB7"/>

  <!-- connecting lines top -->
  <line x1="52" y1="44" x2="66" y2="40" stroke="#7F77DD" stroke-width="1.5" opacity=".5"/>
  <line x1="74" y1="39" x2="88" y2="43" stroke="#7F77DD" stroke-width="1.5" opacity=".5"/>

  <!-- middle nodes — dev layer -->
  <circle cx="38" cy="70" r="3.5" fill="#AFA9EC" opacity=".6"/>
  <circle cx="70" cy="66" r="6" fill="#7F77DD"/>
  <circle cx="102" cy="70" r="3.5" fill="#AFA9EC" opacity=".6"/>

  <!-- connecting lines mid -->
  <line x1="41" y1="68" x2="64" y2="67" stroke="#7F77DD" stroke-width="1.5" opacity=".5"/>
  <line x1="76" y1="67" x2="99" y2="69" stroke="#7F77DD" stroke-width="1.5" opacity=".5"/>
  <line x1="48" y1="48" x2="42" y2="66" stroke="#534AB7" stroke-width="1.5" opacity=".5"/>
  <line x1="92" y1="48" x2="98" y2="66" stroke="#534AB7" stroke-width="1.5" opacity=".5"/>
  <line x1="70" y1="42" x2="70" y2="60" stroke="#7F77DD" stroke-width="1.5" opacity=".5"/>

  <!-- bottom nodes — IA layer -->
  <circle cx="52" cy="96" r="4" fill="#534AB7"/>
  <circle cx="70" cy="102" r="3" fill="#7F77DD" opacity=".7"/>
  <circle cx="88" cy="96" r="4" fill="#534AB7"/>

  <!-- connecting lines bottom -->
  <line x1="44" y1="73" x2="50" y2="92" stroke="#534AB7" stroke-width="1.5" opacity=".5"/>
  <line x1="96" y1="73" x2="90" y2="92" stroke="#534AB7" stroke-width="1.5" opacity=".5"/>
  <line x1="70" y1="72" x2="70" y2="99" stroke="#7F77DD" stroke-width="1.5" opacity=".5"/>
  <line x1="56" y1="97" x2="66" y2="100" stroke="#7F77DD" stroke-width="1.5" opacity=".5"/>
  <line x1="74" y1="101" x2="84" y2="97" stroke="#7F77DD" stroke-width="1.5" opacity=".5"/>

  <!-- WORDMARK -->
  <!-- tidev -->
  <text x="168" y="96" font-family="'Courier New', 'Lucida Console', monospace" font-size="62" font-weight="700" fill="#F1EFE8" letter-spacing="-3">tidev</text>
  <!-- .ia in purple -->
  <text x="355" y="96" font-family="'Courier New', 'Lucida Console', monospace" font-size="62" font-weight="700" fill="#7F77DD" letter-spacing="-2">.ia</text>

  <!-- tagline -->
  <text x="169" y="122" font-family="'Courier New', 'Lucida Console', monospace" font-size="13" fill="#888780" letter-spacing="3">TI  ·  DEV  ·  INTELIGÊNCIA ARTIFICIAL</text>
</svg>
